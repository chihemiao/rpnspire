<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Feedback · VCE Maths</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fbf8f1; --surface: #fff; --ink: #1d2733; --muted: #5a6472; --line: #e2dccd; --brand: #24476b; --accent: #e7f0fa; --err: #b3261e; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14181d; --surface: #1f262e; --ink: #e8ecf1; --muted: #a5afbb; --line: #313a44; --brand: #8db6e3; --accent: #23303d; --err: #f2918a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14181d; --surface: #1f262e; --ink: #e8ecf1; --muted: #a5afbb; --line: #313a44; --brand: #8db6e3; --accent: #23303d; --err: #f2918a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0; }
  input[type="password"] { flex: 1 1 260px; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  button, a.btn { font: 600 15px inherit; padding: 9px 14px; border-radius: 10px; border: 2px solid var(--brand); background: var(--brand); color: var(--bg); cursor: pointer; text-decoration: none; }
  button.alt, a.btn.alt { background: transparent; color: var(--brand); }
  label.inline { display: inline-flex; gap: 6px; align-items: center; }
  .status { min-height: 1.5em; }
  .status.err { color: var(--err); }
  .cards { display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  .meta b { color: var(--ink); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { background: var(--accent); color: var(--brand); border-radius: 999px; padding: 0 8px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>反馈 Feedback</h1>
  <p class="muted">网站上的反馈都在这里。需要先在 Cloudflare 里设置 ADMIN_TOKEN（见仓库 doc/site.md）。</p>
  <form id="f">
    <input type="password" id="token" placeholder="ADMIN_TOKEN" autocomplete="current-password" required>
    <label class="inline"><input type="checkbox" id="notify"> 只看要通知更新的</label>
    <button type="submit">加载</button>
    <button type="button" class="alt" id="csv">导出 CSV</button>
  </form>
  <p class="status" id="status" role="status"></p>
  <div class="cards" id="list"></div>
</main>
<script>
  (function () {
    var token = document.getElementById('token');
    var notify = document.getElementById('notify');
    var status = document.getElementById('status');
    var list = document.getElementById('list');
    try { token.value = sessionStorage.getItem('fb-token') || ''; } catch (e) { /* private mode */ }
    function q() { return '/api/feedback?limit=1000' + (notify.checked ? '&notify=1' : ''); }
    function headers() { return { authorization: 'Bearer ' + token.value.trim() }; }
    function say(t, err) { status.textContent = t; status.className = 'status' + (err ? ' err' : ''); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
    var EDITION = { zh: '中文版', en: '英文版', none: '还没装' };
    async function load() {
      try { sessionStorage.setItem('fb-token', token.value.trim()); } catch (e) { /* private mode */ }
      say('加载中…');
      try {
        var r = await fetch(q(), { headers: headers() });
        var data = await r.json();
        if (!r.ok) { say(data.error || ('HTTP ' + r.status), true); return; }
        list.textContent = '';
        say(data.rows.length + ' 条');
        data.rows.forEach(function (row) {
          var c = el('article', 'card');
          var m = el('div', 'meta');
          m.append(el('span', '', '#' + row.id), el('span', '', new Date(row.created_at).toLocaleString()));
          var who = el('span'); who.append(el('b', '', row.name || '（没写名字）'), document.createTextNode(' '));
          var a = el('a', '', row.email); a.href = 'mailto:' + row.email; who.append(a);
          m.append(who);
          if (row.edition) m.append(el('span', '', EDITION[row.edition] || row.edition));
          if (row.app_version) m.append(el('span', '', 'v' + row.app_version));
          if (row.notify) m.append(el('span', 'pill', '要通知更新'));
          c.append(m, el('div', 'msg', row.message));
          list.append(c);
        });
      } catch (e) { say('出错了：' + e.message, true); }
    }
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); load(); });
    document.getElementById('csv').addEventListener('click', async function () {
      try {
        var r = await fetch(q() + '&format=csv', { headers: headers() });
        if (!r.ok) { say('HTTP ' + r.status, true); return; }
        var blob = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = notify.checked ? 'feedback-notify.csv' : 'feedback.csv';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      } catch (e) { say('出错了：' + e.message, true); }
    });
    if (token.value) load();
  })();
</script>
</body>
</html>
